<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/logo-yutu.ico" type="image/x-icon">
    <title>YouTube</title>
</head>
<body>
    <header class="encabezado">
        <nav class="encabezado left">
            <button class="btn"><img src="img/menu.png" class="icon"></button>
            <img src="img/logo.png" class="logo">
        </nav>
        <nav class="encabezado buscador">
            <input type="text" class="buscar escribir" placeholder="Buscar">
            <button class="buscar btn-buscar"><img src="img/lupa.png" class="icon"></button>
            <button class="btn btn-micro"><img src="img/microfono.png" class="icon"></button>
        </nav>
        <nav class="encabezado right">
            <button class="btn crear"><img src="img/mas.png" class="icon">Crear</button>
            <button class="btn"><img src="img/camapana.png " class="icon"></button>
            <img src="img/perfil.png" class="perfil">
        </nav>
    </header>
</body>
</html>
